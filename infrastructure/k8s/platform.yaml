apiVersion: v1
kind: Namespace
metadata:
  name: cbt
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: cbt-config
  namespace: cbt
data:
  API_PREFIX: /api/v1
  NODE_ENV: production
  SMTP_MODE: console
---
apiVersion: v1
kind: Secret
metadata:
  name: cbt-secrets
  namespace: cbt
type: Opaque
stringData:
  DATABASE_URL: mysql://cbt:cbt_secret@mysql:3306/cbt
  JWT_ACCESS_SECRET: change-me-access-secret-min-32-chars!!
  JWT_REFRESH_SECRET: change-me-refresh-secret-min-32-chars!
  ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: cbt
spec:
  replicas: 2
  selector:
    matchLabels:
      app: api
  template:
    metadata:
      labels:
        app: api
    spec:
      containers:
        - name: api
          image: cbt/api:latest
          ports:
            - containerPort: 4000
          envFrom:
            - configMapRef:
                name: cbt-config
            - secretRef:
                name: cbt-secrets
          readinessProbe:
            httpGet:
              path: /ready
              port: 4000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 4000
            initialDelaySeconds: 15
            periodSeconds: 20
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: cbt
spec:
  selector:
    app: api
  ports:
    - port: 4000
      targetPort: 4000
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: api-hpa
  namespace: cbt
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: api
  minReplicas: 2
  maxReplicas: 20
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: cbt-ingress
  namespace: cbt
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "25m"
spec:
  rules:
    - host: cbt.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
          - path: /ws
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 4000
